apiVersion: 1

groups:
  - orgId: 1
    name: noc-alerts
    folder: NOC Operations
    interval: 10s
    rules:
      - uid: http-500-error-alert
        title: HTTP 500 Internal Server Error Alert
        condition: C
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: sum(rate(http_server_requests_seconds_count{status="500"}[1m]))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            queryType: ''
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: $B > 0
              refId: C
              type: math
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Phat hien loi HTTP 500 tren Backend Service"
          description: "So luong request loi 500 dang lon hon 0 trong 1 phut qua (metric: http_server_requests_seconds_count)"
        labels:
          severity: critical
