apiVersion: 1

contactPoints:
  - orgId: 1
    name: Telegram-Alerts
    receivers:
      - uid: telegram-receiver
        type: telegram
        settings:
          bottoken: "YOUR_TELEGRAM_BOT_TOKEN"
          chatid: "YOUR_TELEGRAM_CHAT_ID"
        disableResolveMessage: false

  - orgId: 1
    name: Slack-Alerts
    receivers:
      - uid: slack-receiver
        type: slack
        settings:
          url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
        disableResolveMessage: false
